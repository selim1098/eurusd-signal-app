<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EUR/USD Signal</title><style>body{font:16px system-ui;background:#101827;color:#eef2ff;padding:18px;max-width:600px;margin:auto}.card{background:#1b2638;padding:18px;border-radius:14px;margin:14px 0}input,button,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:9px}button{background:#2563eb;color:white;border:0}.signal{text-align:center;font-size:30px;font-weight:bold;padding:18px;background:#27364c;border-radius:10px}.note{color:#ffd68a}</style><h1>EUR/USD Signal</h1><p>শিক্ষামূলক ডেমো</p><div class="card"><div>সিগন্যাল</div><div id="s" class="signal">WAIT</div><p id="d">দুটি দাম লিখে বিশ্লেষণ করুন।</p></div><div class="card"><h3>ম্যানুয়াল বিশ্লেষণ</h3><label>বর্তমান দাম</label><input id="p" type="number" step=".00001" placeholder="1.08500"><label>আগের দাম</label><input id="o" type="number" step=".00001" placeholder="1.08480"><label>থ্রেশহোল্ড (পিপস)</label><input id="t" type="number" value="5" min="1"><button onclick="a()">বিশ্লেষণ করুন</button><p class="note">এটি লাইভ মার্কেট ডেটা নেয় না। সংকেত নিশ্চিত নয়; বাস্তব ট্রেডিংয়ের আগে ডেমোতে পরীক্ষা করুন।</p></div><script>function a(){let p=+document.getElementById('p').value,o=+document.getElementById('o').value,t=Math.max(1,+document.getElementById('t').value||5)*.0001,s=document.getElementById('s'),d=document.getElementById('d');if(!p||!o){s.textContent='WAIT';d.textContent='দুটি বৈধ দাম লিখুন।';return}let x=p-o;if(x>=t){s.textContent='BUY';d.textContent='দাম বেড়েছে: '+x.toFixed(5)}else if(x<=-t){s.textContent='SELL';d.textContent='দাম কমেছে: '+x.toFixed(5)}else{s.textContent='WAIT';d.textContent='পরিবর্তন কম; অপেক্ষা করুন।'}}</script></html>
